name: Compilar Albion Marketrelli 1.1.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/albion-market-america-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Descargar y verificar fuente 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="/tmp/albion-marketrelli-v1.1.0-source.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.google.com/uc?export=download&id=1h3GnBTh_3mtRYyXAtJ5UQHe4XmGf3sFG" \
            --output "$SOURCE_ZIP"
          file "$SOURCE_ZIP"
          echo "3e5b595b96570b91962b1532521b8b2c301cecee4453dc2fd2ebe4a2cc995b1b  $SOURCE_ZIP" | sha256sum --check --strict
          unzip -oq "$SOURCE_ZIP" -d .

          test -f albionapp/AGENTS.md
          test -f albionapp/PROJECT_STATE.md
          test -f albionapp/src/main/AndroidManifest.xml
          test -f albionapp/src/main/java/cl/javiersanmartin/albionmarketamerica/MainActivity.java
          test -f albionapp/src/main/java/cl/javiersanmartin/albionmarketamerica/InsetsPolicy.java
          grep -F 'versionCode = 2' albionapp/build.gradle.kts
          grep -F 'versionName = "1.1.0"' albionapp/build.gradle.kts
          grep -F 'applicationId = "cl.javiersanmartin.albionmarketrelli"' albionapp/build.gradle.kts

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Validar catálogo, mercado y configuración Android
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            albionapp/web-tests/core.test.mjs \
            albionapp/web-tests/android-config.test.mjs \
            | tee Albion_Marketrelli-v1.1.0-node-tests.txt
          node --check albionapp/src/main/assets/www/app.js
          node --check albionapp/src/main/assets/www/src/core.mjs

      - name: Probar diseño en múltiples anchos y navegaciones
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright==1.57.0
          CHROMIUM_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROMIUM_BIN"
          export CHROMIUM_BIN
          python3 albionapp/web-tests/layout_test.py | tee Albion_Marketrelli-v1.1.0-layout-tests.txt

      - name: Comprobar Android SDK 35 preinstalado
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Ejecutar pruebas unitarias Android
        shell: bash
        run: gradle :albionapp:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK de depuración
        shell: bash
        run: gradle :albionapp:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK, firma y metadatos
        shell: bash
        run: |
          set -euo pipefail
          APK="albionapp/build/outputs/apk/debug/albionapp-debug.apk"
          OUTPUT="Albion_Marketrelli-v1.1.0.apk"
          PREFIX="Albion_Marketrelli-v1.1.0"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "${PREFIX}-signature.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "${PREFIX}-badging.txt"

          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "${PREFIX}-signature.txt"
          grep -F "package: name='cl.javiersanmartin.albionmarketrelli' versionCode='2' versionName='1.1.0'" "${PREFIX}-badging.txt"
          grep -F "application-label:'Albion Marketrelli'" "${PREFIX}-badging.txt"
          grep -F "sdkVersion:'26'" "${PREFIX}-badging.txt"
          grep -F "targetSdkVersion:'35'" "${PREFIX}-badging.txt"

          unzip -l "$APK" | grep -F "assets/www/index.html"
          unzip -l "$APK" | grep -F "assets/www/app.js"
          unzip -l "$APK" | grep -F "assets/www/src/core.mjs"
          unzip -l "$APK" | grep -F "assets/www/styles.css"
          unzip -l "$APK" | grep -F "assets/www/icons/icon-192.png"
          unzip -l "$APK" | grep -F "res/drawable/app_icon.png"

          unzip -p "$APK" assets/www/index.html | grep -F "Albion Marketrelli"
          unzip -p "$APK" assets/www/manifest.webmanifest | grep -F '"name": "Albion Marketrelli"'
          unzip -p "$APK" assets/www/src/core.mjs | grep -F "Black Market"
          unzip -p "$APK" assets/www/src/core.mjs | grep -F "T4_BAG"
          unzip -p "$APK" assets/www/styles.css | grep -F "overflow-x: clip"

          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" | tee "${PREFIX}.sha256"
          stat --printf='Tamaño: %s bytes\n' "$OUTPUT" | tee "${PREFIX}-size.txt"

      - name: Publicar APK verificado
        uses: actions/upload-artifact@v4
        with:
          name: Albion_Marketrelli-v1.1.0
          path: |
            Albion_Marketrelli-v1.1.0.apk
            Albion_Marketrelli-v1.1.0.sha256
            Albion_Marketrelli-v1.1.0-size.txt
            Albion_Marketrelli-v1.1.0-badging.txt
            Albion_Marketrelli-v1.1.0-signature.txt
            Albion_Marketrelli-v1.1.0-node-tests.txt
            Albion_Marketrelli-v1.1.0-layout-tests.txt
            albionapp/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 30
