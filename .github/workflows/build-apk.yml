name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK de depuración
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar estructura y firma del APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "Snake_DeepSeek-v1.2.apk"
          sha256sum "Snake_DeepSeek-v1.2.apk" | tee "Snake_DeepSeek-v1.2.sha256"

      - name: Publicar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Snake_DeepSeek-v1.2
          path: |
            Snake_DeepSeek-v1.2.apk
            Snake_DeepSeek-v1.2.sha256
          if-no-files-found: error
          retention-days: 30
