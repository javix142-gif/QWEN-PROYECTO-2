name: Compilar Calendario Simple APK

on:
  push:
    branches:
      - chatgpt-calendar-apk-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Descargar rama runner
        uses: actions/checkout@v6
        with:
          ref: chatgpt-calendar-apk-build

      - name: Descargar proyecto Calendario Simple
        uses: actions/checkout@v6
        with:
          repository: javix142-gif/CALENDAR-PROYECT
          ref: chatgpt-calendar-simple-build
          path: calendar-src

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Comprobar Android SDK 35 preinstalado
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Compilar APK de depuración
        working-directory: calendar-src/chatgpt-calendar-simple
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK y firma
        shell: bash
        run: |
          set -euo pipefail
          APK="calendar-src/chatgpt-calendar-simple/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p build-artifacts
          cp "$APK" "build-artifacts/Calendario-Simple-1.0.0-debug.apk"
          sha256sum "build-artifacts/Calendario-Simple-1.0.0-debug.apk" | tee "build-artifacts/Calendario-Simple-1.0.0-debug.sha256"

      - name: Publicar artefacto Actions
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-Simple-1.0.0-debug
          path: |
            build-artifacts/Calendario-Simple-1.0.0-debug.apk
            build-artifacts/Calendario-Simple-1.0.0-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK en rama temporal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-artifacts/Calendario-Simple-1.0.0-debug.apk build-artifacts/Calendario-Simple-1.0.0-debug.sha256
          if git diff --cached --quiet; then
            echo 'APK sin cambios.'
          else
            git commit -m 'ci: publish Calendario Simple APK'
            git push origin HEAD:chatgpt-calendar-apk-build
          fi
