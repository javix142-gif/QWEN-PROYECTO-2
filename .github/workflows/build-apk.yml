name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Comprobar Android SDK 35 preinstalado
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Compilar APK de depuración
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar estructura y firma del APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -F "assets/difficulty-bootstrap.js"
          unzip -l "$APK" | grep -F "assets/difficulty.css"
          cp "$APK" "Snake_DeepSeek-v1.4.apk"
          sha256sum "Snake_DeepSeek-v1.4.apk" | tee "Snake_DeepSeek-v1.4.sha256"

      - name: Publicar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Snake_DeepSeek-v1.4
          path: |
            Snake_DeepSeek-v1.4.apk
            Snake_DeepSeek-v1.4.sha256
          if-no-files-found: error
          retention-days: 30
