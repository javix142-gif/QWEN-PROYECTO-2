<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valheim 2D - Mundo Vikingo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        
        .stat-bar {
            margin-bottom: 8px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 5px;
            border: 2px solid #4a4a6a;
        }
        
        .bar-container {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 3px;
        }
        
        .bar-fill {
            height: 100%;
            transition: width 0.3s;
        }
        
        #healthBar { background: linear-gradient(90deg, #8b0000, #ff4444); }
        #staminaBar { background: linear-gradient(90deg, #228b22, #32cd32); }
        #hungerBar { background: linear-gradient(90deg, #daa520, #ffd700); }
        
        #inventory {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #6a6a8a;
            display: flex;
            gap: 5px;
        }
        
        .slot {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #888;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
        }
        
        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 12px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            line-height: 1.6;
        }
        
        #minimap {
            position: absolute;
            top: 10px;
            right: 10px;
            border: 3px solid #6a6a8a;
            border-radius: 5px;
            background: rgba(0,0,0,0.8);
        }
        
        #biomeInfo {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
            color: #ffd700;
            font-size: 18px;
            text-align: center;
            display: none;
            border: 3px solid #8b4513;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div class="stat-bar">
            <div>Vida</div>
            <div class="bar-container">
                <div id="healthBar" class="bar-fill" style="width: 100%"></div>
            </div>
        </div>
        <div class="stat-bar">
            <div>Estamina</div>
            <div class="bar-container">
                <div id="staminaBar" class="bar-fill" style="width: 100%"></div>
            </div>
        </div>
        <div class="stat-bar">
            <div>Hambre</div>
            <div class="bar-container">
                <div id="hungerBar" class="bar-fill" style="width: 100%"></div>
            </div>
        </div>
    </div>
    
    <div id="inventory"></div>
    
    <div id="controls">
        <strong>Controles:</strong><br>
        WASD / Flechas: Moverse<br>
        Click izquierdo: Usar herramienta<br>
        Click derecho: Colocar bloque<br>
        1-5: Seleccionar slot<br>
        E: Interactuar<br>
        B: Construir<br>
        M: Mostrar minimap<br>
    </div>
    
    <canvas id="minimap" width="150" height="150"></canvas>
    
    <div id="biomeInfo">
        Bioma: <span id="currentBiome">Desconocido</span><br>
        Tiempo: <span id="timeDisplay">Día</span>
    </div>
    
    <div id="message"></div>
    
    <script src="game.js"></script>
</body>
</html>
